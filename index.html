<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulkans 下载站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ============ Light theme (default) — Claude-inspired ============ */
        :root, [data-theme="light"] {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --surface2: #f0f0f2;
            --border: #e5e5ea;
            --text: #374151;
            --text-dim: #8e8ea0;
            --accent: #d97706;
            --accent2: #f59e0b;
            --accent-soft: rgba(217,119,6,0.08);
            --green: #059669;
            --amber: #d97706;
            --red: #dc2626;
            --purple: #7c3aed;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.05);
            --btn-bg: transparent;
            --btn-color: var(--accent);
            --btn-border: var(--accent);
        }
        [data-theme="dark"] {
            --bg: #1a1a1a;
            --surface: #2a2a2a;
            --surface2: #333336;
            --border: #3f3f46;
            --text: #e5e5e7;
            --text-dim: #9ca3af;
            --accent: #f59e0b;
            --accent2: #fbbf24;
            --accent-soft: rgba(245,158,11,0.12);
            --green: #34d399;
            --amber: #fbbf24;
            --red: #f87171;
            --purple: #c4b5fd;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.3);
            --btn-bg: transparent;
            --btn-color: var(--accent);
            --btn-border: var(--accent);
        }
        * { box-sizing: border-box; }
        html, body { transition: background 0.3s ease, color 0.3s ease; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            line-height: 1.65;
            letter-spacing: 0.01em;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: -10%;
            width: 60%; height: 50%;
            background: radial-gradient(circle at 30% 40%, var(--accent-soft) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -10%;
            width: 55%; height: 45%;
            background: radial-gradient(circle at 70% 60%, rgba(124,58,237,0.04) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        [data-theme="dark"] body::after { background: radial-gradient(circle at 70% 60%, rgba(217,119,6,0.08) 0%, transparent 60%); }
        .content { position: relative; z-index: 1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
        .theme-toggle {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }
        .theme-toggle:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .title-accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .panel:hover { box-shadow: var(--shadow-md); }
        .collapse-toggle {
            cursor: pointer; user-select: none;
            transition: all 0.2s;
            border-radius: 12px 12px 0 0;
        }
        .collapse-toggle:hover { background: var(--surface2); }
        .collapse-content {
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
        }
        .collapse-content.collapsed { max-height: 0 !important; opacity: 0; }
        .collapse-icon { transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); display: inline-block; }
        .collapse-icon.rotated { transform: rotate(180deg); }
        .file-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: all 0.22s ease;
            box-shadow: var(--shadow-sm);
        }
        .file-card:hover {
            border-color: var(--accent2);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .cat-btn {
            padding: 7px 13px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 500;
            transition: all 0.22s ease;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            white-space: nowrap;
        }
        .cat-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }
        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px var(--accent-soft);
        }
        .cat-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .search-input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 11px 18px 11px 46px;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        .search-input::placeholder { color: var(--text-dim); }
        .markdown-body { color: var(--text); font-size: 14px; line-height: 1.8; }
        .markdown-body h1 {
            font-size: 1.5em;
            margin: 0 0 0.5em; font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .markdown-body h2 {
            font-size: 1.15em; color: var(--text);
            margin: 1.2em 0 0.5em; padding-bottom: 0.4em;
            border-bottom: 1px solid var(--border);
            font-weight: 650;
        }
        .markdown-body h3 { font-size: 1em; color: var(--accent); margin: 1em 0 0.4em; font-weight: 600; }
        .markdown-body p { margin: 0 0 0.8em; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0 0 0.8em; }
        .markdown-body li { margin: 0.2em 0; }
        .markdown-body code {
            background: var(--surface2); padding: 2px 6px;
            border-radius: 5px; font-size: 0.88em;
            color: var(--accent); font-family: 'SF Mono', ui-monospace, Consolas, monospace;
        }
        .markdown-body pre {
            background: var(--surface2); padding: 14px 18px;
            border-radius: 10px; overflow-x: auto;
            border: 1px solid var(--border);
        }
        .markdown-body pre code { background: none; padding: 0; color: var(--text); }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 13.5px; }
        .markdown-body th {
            background: var(--surface2); padding: 9px 14px;
            text-align: left; border-bottom: 1px solid var(--border);
            color: var(--accent); font-weight: 600;
        }
        .markdown-body td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
        .markdown-body a {
            color: var(--accent); text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }
        .markdown-body blockquote {
            border-left: 3px solid var(--accent2); margin: 0.8em 0;
            padding: 0.6em 1.1em; background: var(--surface2);
            border-radius: 0 10px 10px 0; color: var(--text-dim);
        }
        .version-item {
            border-left: 2px solid var(--border);
            padding: 10px 16px;
            margin-left: 10px;
            transition: all 0.2s;
            border-radius: 0 8px 8px 0;
        }
        .version-item:hover {
            border-left-color: var(--accent);
            background: var(--surface2);
        }
        .dl-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 14px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            cursor: pointer;
            transition: all 0.2s ease; text-decoration: none;
            white-space: nowrap;
        }
        .dl-btn:hover,
        .dl-btn:focus,
        .dl-btn:active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 3px 10px var(--accent-soft);
            transform: translateY(-1px);
        }
        .dl-btn-sm {
            padding: 6px 13px; font-size: 12.5px;
            background: transparent; color: var(--text-dim);
            border: 1px solid var(--border); border-radius: 8px;
            text-decoration: none; display: inline-flex;
            align-items: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .dl-btn-sm:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }
        .hamburger {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.25s ease;
            position: relative;
        }
        .hamburger:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(3px);
            opacity: 0; visibility: hidden;
            transition: all 0.25s ease;
            z-index: 998;
        }
        .overlay.open { opacity: 1; visibility: visible; }
        .drawer {
            position: fixed; top: 0; right: 0;
            width: 320px; max-width: 86vw; height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -8px 0 30px rgba(0,0,0,0.12);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index: 999;
            display: flex; flex-direction: column;
        }
        .drawer.open { transform: translateX(0); }
        .drawer-header {
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .drawer-title { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .drawer-close {
            width: 32px; height: 32px;
            border-radius: 8px; border: none;
            background: var(--surface2); color: var(--text-dim);
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .drawer-close:hover { color: var(--red); background: rgba(239,68,68,0.1); }
        .drawer-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
        .setting-group { margin-bottom: 22px; }
        .setting-label {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: block;
        }
        .preset-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .preset-btn {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            background: var(--surface2);
        }
        .preset-btn::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--pa) 0%, var(--pb) 100%);
            opacity: 0.9;
        }
        .preset-btn::after {
            content: attr(data-name);
            position: absolute; left: 0; right: 0; bottom: 4px;
            text-align: center; font-size: 10px; font-weight: 600;
            color: rgba(0,0,0,0.75);
            text-shadow: 0 1px 2px rgba(255,255,255,0.3);
        }
        .preset-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .preset-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
        .swatch-row { display: flex; gap: 10px; align-items: center; }
        .swatch-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .swatch-wrap label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
        .swatch-wrap input[type="color"] {
            width: 100%; height: 38px; padding: 2px;
            border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface2); cursor: pointer;
            -webkit-appearance: none;
        }
        .swatch-wrap input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
        .reset-btn {
            width: 100%; margin-top: 8px;
            padding: 10px; border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface2); color: var(--text-dim);
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover { color: var(--red); border-color: var(--red); background: rgba(239,68,68,0.06); }
        .badge {
            font-size: 11px; padding: 3px 9px;
            border-radius: 7px; font-weight: 600;
        }
        .icon-pill {
            width: 42px; height: 42px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
    <aside class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-label="设置">
        <div class="drawer-header">
            <div class="drawer-title" style="color: var(--text);">
                <i class="fas fa-sliders-h" style="color: var(--accent);"></i> 显示设置
            </div>
            <button class="drawer-close" onclick="closeDrawer()" aria-label="关闭">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="drawer-body">
            <div class="setting-group">
                <span class="setting-label">主题模式</span>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button onclick="setTheme('light')" id="mode-light"
                        style="padding: 10px; border-radius: 10px; border: 1.5px solid var(--border); background: #ffffff; color: #374151; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;">
                        <i class="fas fa-sun mr-1"></i> 亮色
                    </button>
                    <button onclick="setTheme('dark')" id="mode-dark"
                        style="padding: 10px; border-radius: 10px; border: 1.5px solid var(--border); background: #1a1a1a; color: #e5e5e7; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;">
                        <i class="fas fa-moon mr-1"></i> 暗色
                    </button>
                </div>
            </div>
            <div class="setting-group">
                <span class="setting-label">强调色预设</span>
                <div class="preset-row" id="presetRow"></div>
            </div>
            <div class="setting-group">
                <span class="setting-label">自定义强调色</span>
                <div class="swatch-row">
                    <div class="swatch-wrap">
                        <label for="swatchA">主色</label>
                        <input type="color" id="swatchA" value="#d97706" oninput="applyCustomAccent()">
                    </div>
                    <div class="swatch-wrap">
                        <label for="swatchB">辅色</label>
                        <input type="color" id="swatchB" value="#f59e0b" oninput="applyCustomAccent()">
                    </div>
                </div>
                <button class="reset-btn" onclick="resetAccent()">
                    <i class="fas fa-undo mr-1"></i> 恢复默认配色
                </button>
            </div>
            <div class="setting-group">
                <span class="setting-label">关于本站</span>
                <div id="aboutBody" class="markdown-body" style="font-size: 13px;"></div>
                <div id="aboutFriends" class="mt-3 space-y-2"></div>
            </div>
            <div style="font-size: 11px; color: var(--text-dim); padding-top: 10px; border-top: 1px solid var(--border); line-height: 1.5;">
                配色偏好保存在本地，仅影响你自己的视图。
            </div>
        </div>
    </aside>

    <div class="content max-w-4xl mx-auto px-4 py-8">
        <header class="flex items-center justify-between mb-8 pb-6" style="border-bottom: 1px solid var(--border);">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-3 title-accent">
                    <i class="fas fa-microchip"></i>
                    Vulkans 下载站
                </h1>
                <p class="mt-1 text-sm" style="color: var(--text-dim);">Vulkan 驱动下载 · 适配查询 · 持续更新</p>
            </div>
            <div class="flex items-center gap-2">
                <a href="https://github.com/Wxjxpp/pull.github.io" target="_blank"
                   class="theme-toggle" title="GitHub 源码">
                    <i class="fab fa-github"></i>
                </a>
                <button class="hamburger" onclick="toggleDrawer()" title="设置">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- News Banner -->
        <div class="mb-6 panel" id="newsBanner">
            <div class="collapse-toggle flex items-center justify-between px-5 py-4" onclick="toggleNews()">
                <div class="flex items-center gap-2.5">
                    <i class="fas fa-newspaper" style="color: var(--accent);"></i>
                    <span class="font-semibold text-sm">最新动态</span>
                    <span class="badge" style="background: var(--surface2); color: var(--text-dim);" id="newsBadge">0 条</span>
                </div>
                <i class="fas fa-chevron-down collapse-icon text-sm" id="newsIcon" style="color: var(--text-dim);"></i>
            </div>
            <div class="collapse-content" id="newsContent" style="max-height: 2000px;">
                <div class="px-5 pb-5" id="newsBody"></div>
            </div>
        </div>

        <div class="mb-6 panel">
            <div class="collapse-toggle flex items-center justify-between px-5 py-4" onclick="toggleReadme()">
                <div class="flex items-center gap-2.5">
                    <i class="fas fa-book-open" style="color: var(--accent);"></i>
                    <span class="font-semibold text-sm">仓库说明</span>
                    <span class="badge" style="background: var(--surface2); color: var(--text-dim);">README</span>
                </div>
                <i class="fas fa-chevron-down collapse-icon text-sm" id="readmeIcon" style="color: var(--text-dim);"></i>
            </div>
            <div class="collapse-content" id="readmeContent" style="max-height: 2000px;">
                <div class="px-5 pb-5 markdown-body" id="readmeBody">
                    <div class="flex items-center gap-3 py-8 justify-center" style="color: var(--text-dim);">
                        <i class="fas fa-spinner fa-pulse"></i> 请稍等，故事之王正在赶来…
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-6 panel">
            <div class="collapse-toggle flex items-center justify-between px-5 py-4" onclick="toggleCapsViewer()">
                <div class="flex items-center gap-2.5">
                    <i class="fas fa-flask" style="color: var(--green);"></i>
                    <span class="font-semibold text-sm">VulkanCapsViewer 下载</span>
                    <span class="badge" style="background: var(--surface2); color: var(--text-dim);">官方工具</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-xs" id="capsVersion" style="color: var(--text-dim);">v4.12</span>
                    <i class="fas fa-chevron-down collapse-icon text-sm" id="capsIcon" style="color: var(--text-dim);"></i>
                </div>
            </div>
            <div class="collapse-content" id="capsContent" style="max-height: 2000px;">
                <div class="px-5 pb-5" id="capsBody">
                    <div class="flex items-center gap-3 py-8 justify-center" style="color: var(--text-dim);">
                        <i class="fas fa-spinner fa-pulse"></i> 哎呀哎呀，正在吃小饼干…
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <div class="flex flex-wrap gap-2" id="categoryNav"></div>
        </div>

        <div class="mb-4 relative">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-sm" style="color: var(--text-dim); z-index: 2;"></i>
            <input type="text" id="searchInput"
                placeholder="搜索 GPU 型号、设备名称或文件名..."
                class="search-input"
                oninput="applyFilter()" />
        </div>

        <div class="panel overflow-hidden">
            <div class="px-5 py-4 flex items-center justify-between" style="border-bottom: 1px solid var(--border);">
                <div class="flex items-center gap-2 text-sm font-medium" style="color: var(--text-dim);">
                    <i class="fas fa-folder-open" style="color: var(--amber);"></i>
                    <span id="breadcrumb">/vulkans</span>
                </div>
                <div id="fileCount" class="text-xs uppercase tracking-wider" style="color: var(--text-dim);">正在啃爆提拉米苏…</div>
            </div>
            <div id="fileList" class="p-3 sm:p-4 space-y-2"></div>
        </div>

        <footer class="mt-10 text-center text-xs" style="color: var(--text-dim);">
            <p>Vulkans Download Station · Powered by GitHub Pages</p>
        </footer>
    </div>

    <script>
        const EMBEDDED_FILES = {
  "snapdragon": [
