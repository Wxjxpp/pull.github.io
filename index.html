    <style>
        /* ============ Light theme (default) ============ */
        :root, [data-theme="light"] {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --surface2: #f0f2f7;
            --border: #e2e6ef;
            --text: #1f2937;
            --text-dim: #6b7280;
            --accent: #6366f1;
            --accent2: #818cf8;
            --accent-soft: rgba(99,102,241,0.08);
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --purple: #8b5cf6;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(17,24,39,0.06);
        }

        /* ============ Dark theme ============ */
        [data-theme="dark"] {
            --bg: #0f1220;
            --surface: #181c2e;
            --surface2: #202640;
            --border: #2b3250;
            --text: #e2e8f0;
            --text-dim: #8892b0;
            --accent: #818cf8;
            --accent2: #a5b4fc;
            --accent-soft: rgba(129,140,248,0.12);
            --green: #34d399;
            --amber: #fbbf24;
            --red: #f87171;
            --purple: #c4b5fd;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 6px 20px rgba(0,0,0,0.25);
        }

        * { box-sizing: border-box; }
        html, body { transition: background 0.3s ease, color 0.3s ease; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            line-height: 1.65;
            letter-spacing: 0.01em;
        }

        /* Soft ambient gradient */
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: -10%;
            width: 60%; height: 50%;
            background: radial-gradient(circle at 30% 40%, var(--accent-soft) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -10%;
            width: 55%; height: 45%;
            background: radial-gradient(circle at 70% 60%, rgba(139,92,246,0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        [data-theme="dark"] body::after { background: radial-gradient(circle at 70% 60%, rgba(196,181,253,0.08) 0%, transparent 60%); }

        .content { position: relative; z-index: 1; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* Theme toggle */
        .theme-toggle {
            width: 38px; height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }
        .theme-toggle:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        /* Accent text */
        .title-accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Panel style */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .panel:hover { box-shadow: var(--shadow-md); }

        /* Collapsible */
        .collapse-toggle {
            cursor: pointer; user-select: none;
            transition: all 0.2s;
            border-radius: 12px 12px 0 0;
        }
        .collapse-toggle:hover { background: var(--surface2); }
        .collapse-content {
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
        }
        .collapse-content.collapsed { max-height: 0 !important; opacity: 0; }
        .collapse-icon { transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); display: inline-block; }
        .collapse-icon.rotated { transform: rotate(180deg); }

        /* File card */
        .file-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: all 0.22s ease;
            box-shadow: var(--shadow-sm);
        }
        .file-card:hover {
            border-color: var(--accent2);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        /* Category button */
        .cat-btn {
            padding: 7px 13px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 500;
            transition: all 0.22s ease;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-dim);
            white-space: nowrap;
        }
        .cat-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }
        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px var(--accent-soft);
        }
        .cat-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* Search */
        .search-input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            padding: 11px 18px 11px 46px;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }
        .search-input::placeholder { color: var(--text-dim); }

        /* Markdown content */
        .markdown-body { color: var(--text); font-size: 14px; line-height: 1.8; }
        .markdown-body h1 {
            font-size: 1.5em;
            margin: 0 0 0.5em; font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .markdown-body h2 {
            font-size: 1.15em; color: var(--text);
            margin: 1.2em 0 0.5em; padding-bottom: 0.4em;
            border-bottom: 1px solid var(--border);
            font-weight: 650;
        }
        .markdown-body h3 { font-size: 1em; color: var(--accent); margin: 1em 0 0.4em; font-weight: 600; }
        .markdown-body p { margin: 0 0 0.8em; }
        .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin: 0 0 0.8em; }
        .markdown-body li { margin: 0.2em 0; }
        .markdown-body code {
            background: var(--surface2); padding: 2px 6px;
            border-radius: 5px; font-size: 0.88em;
            color: var(--accent); font-family: 'SF Mono', ui-monospace, Consolas, monospace;
        }
        .markdown-body pre {
            background: var(--surface2); padding: 14px 18px;
            border-radius: 10px; overflow-x: auto;
            border: 1px solid var(--border);
        }
        .markdown-body pre code { background: none; padding: 0; color: var(--text); }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 13.5px; }
        .markdown-body th {
            background: var(--surface2); padding: 9px 14px;
            text-align: left; border-bottom: 1px solid var(--border);
            color: var(--accent); font-weight: 600;
        }
        .markdown-body td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
        .markdown-body a {
            color: var(--accent); text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .markdown-body a:hover { border-bottom-color: var(--accent); }
        .markdown-body blockquote {
            border-left: 3px solid var(--accent2); margin: 0.8em 0;
            padding: 0.6em 1.1em; background: var(--surface2);
            border-radius: 0 10px 10px 0; color: var(--text-dim);
        }

        /* Version history */
        .version-item {
            border-left: 2px solid var(--border);
            padding: 10px 16px;
            margin-left: 10px;
            transition: all 0.2s;
            border-radius: 0 8px 8px 0;
        }
        .version-item:hover {
            border-left-color: var(--accent);
            background: var(--surface2);
        }

        /* Download button */
        .dl-btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 20px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
            color: #fff;
            border: none; cursor: pointer;
            transition: all 0.22s ease; text-decoration: none;
            box-shadow: 0 2px 8px var(--accent-soft);
        }
        .dl-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px var(--accent-soft);
            filter: brightness(1.08);
        }
        .dl-btn-sm {
            padding: 6px 13px; font-size: 12.5px;
            background: var(--surface2); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            text-decoration: none; display: inline-flex;
            align-items: center; gap: 5px;
            transition: all 0.2s ease;
        }
        .dl-btn-sm:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
        }

        .badge {
            font-size: 11px; padding: 3px 9px;
            border-radius: 7px; font-weight: 600;

            width: 42px; height: 42px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            flex-shrink: 0;
        }
    </style>
</head>

        // ============ README ============
        let readmeOpen = true;
        async function loadReadme() {
            const body = document.getElementById('readmeBody');
            try {
                const resp = await fetch('https://raw.githubusercontent.com/Wxjxpp/pull.github.io/main/README.md');
                if (!resp.ok) throw new Error('not found');
                const md = await resp.text();
                body.innerHTML = marked.parse(md);
            } catch (e) {
                body.innerHTML = `<p style="color: var(--text-dim);">暂无 README 说明文件</p>`;
            }
        }
        function toggleReadme() {
            readmeOpen = !readmeOpen;
            const content = document.getElementById('readmeContent');
            const icon = document.getElementById('readmeIcon');
            if (readmeOpen) {
                content.classList.remove('collapsed');
                icon.classList.remove('rotated');
            } else {
                content.classList.add('collapsed');
                icon.classList.add('rotated');
            }
        }

        // ============ VulkanCapsViewer ============
        let capsOpen = true;
        const CAPS_CACHE_KEY = 'vulkancaps_history';
        const CAPS_URL = 'https://vulkan.gpuinfo.org/download.php';
        const CORS_PROXY = 'https://corsproxy.io/?';

        function getCapsHistory() {
            try { return JSON.parse(localStorage.getItem(CAPS_CACHE_KEY)) || []; }
            catch { return []; }
        }
        function saveCapsHistory(history) {
            try { localStorage.setItem(CAPS_CACHE_KEY, JSON.stringify(history)); }
            catch {}
        }

        async function fetchCapsViewer() {
            const body = document.getElementById('capsBody');
            const versionEl = document.getElementById('capsVersion');
            let history = getCapsHistory();

            try {
                const resp = await fetch(CORS_PROXY + encodeURIComponent(CAPS_URL));
                const html = await resp.text();

                // Parse Android APK link
                const apkMatch = html.match(/href="([^"]*vulkancapsviewer[^"]*arm\.apk)"/i);
                const versionMatch = html.match(/Current release\s+([\d.]+)/i) || html.match(/Release (\d+\.\d+)/i);
                const dateMatch = html.match(/(\d{4}-\d{2}-\d{2})/);

                const version = versionMatch ? versionMatch[1] : '';
                const apkUrl = apkMatch ? apkMatch[1] : '';
                const date = dateMatch ? dateMatch[1] : '';
                const timestamp = new Date().toISOString();

                const newEntry = { version, apkUrl, date, timestamp, source: 'fetched' };

                // Deduplicate: only add if version changed
                const existing = history.find(h => h.version === version);
                if (!existing && version && apkUrl) {
                    history.unshift(newEntry);
                    // Keep max 20 entries
                    if (history.length > 20) history = history.slice(0, 20);
                    saveCapsHistory(history);
                }

                versionEl.textContent = version ? 'v' + version : 'v4.12';
                renderCapsViewer(history);
            } catch (e) {
                // Fallback: use embedded data
                if (history.length === 0) {
                    history = [{
                        version: '4.12',
                        apkUrl: 'https://vulkan.gpuinfo.org/downloads/vulkancapsviewer_4.12_arm.apk',
                        date: '2026-07-31',
                        timestamp: new Date().toISOString(),
                        source: 'fallback'
                    }];
                }
                versionEl.textContent = history.length ? 'v' + history[0].version : 'v4.12';
                renderCapsViewer(history);
            }
        }

        function renderCapsViewer(history) {
            const body = document.getElementById('capsBody');
            if (!history.length) {
                body.innerHTML = '<p style="color: var(--text-dim);">暂无下载记录</p>';
                return;
            }

            const latest = history[0];
            const oldEntries = history.slice(1);
            const hasOld = oldEntries.length > 0;

            let html = `
                <div class="flex items-start justify-between gap-4 p-4 rounded-lg" style="background: var(--surface2);">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="badge" style="background: var(--accent2); color: #000;">最新</span>
                            <span class="font-semibold" style="color: var(--accent);">VulkanCapsViewer v${latest.version}</span>
                            ${latest.date ? `<span class="text-xs" style="color: var(--text-dim);">${latest.date}</span>` : ''}
                        </div>
                        <div class="flex flex-wrap gap-2 mt-2">
                            <a href="${latest.apkUrl}" target="_blank" class="dl-btn">
                                <i class="fas fa-download"></i> Android APK (arm64)
                            </a>
                            <a href="https://play.google.com/store/apps/details?id=de.saschawillems.vulkancapsviewer" target="_blank" class="dl-btn-sm">
                                <i class="fab fa-google-play"></i> Google Play
                            </a>
                        </div>
                    </div>
                    <button onclick="refreshCapsViewer()" class="dl-btn-sm" title="刷新检查">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>`;

            if (hasOld) {
                html += `
                <div class="mt-3">
                    <div class="collapse-toggle flex items-center gap-2 text-xs py-2" onclick="toggleCapsHistory()" style="color: var(--text-dim);">
                        <i class="fas fa-chevron-down collapse-icon text-[10px]" id="capsHistIcon"></i>
                        <i class="fas fa-history"></i> 历史版本 (${oldEntries.length})
                    </div>
                    <div class="collapse-content collapsed" id="capsHistory" style="max-height: 1000px;">
                        <div class="space-y-1">`;
                oldEntries.forEach((entry, i) => {
                    html += `
                            <div class="version-item flex items-center justify-between gap-3 py-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs" style="color: var(--text-dim);">v${entry.version}</span>
                                    ${entry.date ? `<span class="text-xs" style="color: var(--text-dim);">· ${entry.date}</span>` : ''}
                                    <span class="text-xs px-1.5 py-0.5 rounded" style="background: var(--surface2); color: var(--text-dim); font-size: 10px;">${entry.source}</span>
                                </div>
                                <a href="${entry.apkUrl}" target="_blank" class="dl-btn-sm text-xs">
                                    <i class="fas fa-download"></i> APK
                                </a>
                            </div>`;
                });
                html += `</div></div></div>`;
            }

            body.innerHTML = html;
        }

        function refreshCapsViewer() {
            const body = document.getElementById('capsBody');
            body.innerHTML = `<div class="flex items-center gap-3 py-8 justify-center" style="color: var(--text-dim);"><i class="fas fa-spinner fa-pulse"></i> 检查更新中...</div>`;
            fetchCapsViewer();
        }

        let capsHistOpen = false;
        function toggleCapsHistory() {
            capsHistOpen = !capsHistOpen;
            const content = document.getElementById('capsHistory');
            const icon = document.getElementById('capsHistIcon');
            if (capsHistOpen) {
                content.classList.remove('collapsed');
                icon.classList.add('rotated');
            } else {
                content.classList.add('collapsed');
                icon.classList.remove('rotated');
            }
        }

        function toggleCapsViewer() {
            capsOpen = !capsOpen;
            const content = document.getElementById('capsContent');
            const icon = document.getElementById('capsIcon');
            if (capsOpen) {
                content.classList.remove('collapsed');
                icon.classList.remove('rotated');
            } else {
                content.classList.add('collapsed');
                icon.classList.add('rotated');
            }
        }

        // ============ File List ============
        function getCDNUrl(category, name, size) {
            if (size && size > LARGE_FILE_THRESHOLD) {
                return `${RAW_BASE}/vulkans/${category}/${encodeURIComponent(name)}`;
            }
            return `${CDN_BASE}/vulkans/${category}/${encodeURIComponent(name)}`;
        }

        function getCategoryFiles(category) {
            if (category === 'all') {
                let all = [];
                for (const [cat, files] of Object.entries(EMBEDDED_FILES)) {
                    files.forEach(f => all.push({ ...f, category: cat }));
                }
                return all;
            }
            return (EMBEDDED_FILES[category] || []).map(f => ({ ...f, category: category }));
        }

        function renderCategoryNav() {
            const nav = document.getElementById('categoryNav');
            const entries = Object.entries(CATEGORIES);
            nav.innerHTML = entries.map(([key, cat]) => {
                const count = key === 'all'
                    ? Object.values(EMBEDDED_FILES).reduce((s, f) => s + f.length, 0)
                    : (EMBEDDED_FILES[key] || []).length;
                const dimmed = count === 0 && key !== 'all' ? 'opacity-40' : '';
                return `
                    <button onclick="switchCategory('${key}')" ${count === 0 && key !== 'all' ? 'disabled' : ''}
                        class="cat-btn ${dimmed} ${key === currentCategory ? 'active' : ''}">
                        <i class="fas ${cat.icon}"></i> ${cat.name}
                    </button>`;
            }).join('');
        }

        function switchCategory(category) {
            currentCategory = category;
            renderCategoryNav();
            showFiles();
        }

        function applyFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const files = getCategoryFiles(currentCategory);
            renderFileList(files, query);
        }

        function renderFileList(files, searchQuery) {
            const container = document.getElementById('fileList');
            const badge = document.getElementById('fileCount');

            let filtered = files;
            if (searchQuery) {
                filtered = files.filter(f => {
                    const m = f.meta;
                    const text = [f.name, m?.gpu, m?.devices, m?.gpuGen, m?.version, m?.note, f.category]
                        .filter(Boolean).join(' ').toLowerCase();
                    return text.includes(searchQuery);
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="p-12 text-center">
                        <i class="fas fa-inbox text-4xl mb-4 block" style="color: var(--border);"></i>
                        ${searchQuery
                            ? '<p style="color: var(--text-dim);">没有匹配「<span style="color: var(--text);">' + escapeHtml(searchQuery) + '</span>」的结果</p>'
                            : '<p style="color: var(--text-dim);">该分类下暂无文件</p>'}
                    </div>`;
                badge.textContent = searchQuery ? '无匹配结果' : '0 个文件';
                return;
            }

            badge.textContent = searchQuery ? `找到 ${filtered.length} 个匹配` : `${filtered.length} 个文件`;

            container.innerHTML = filtered.map(f => {
                const ext = f.name.split('.').pop().toLowerCase();
                const icon = getFileIcon(ext);
                const m = f.meta;
                const catLabel = currentCategory === 'all' && CATEGORIES[f.category]
                    ? `<span class="badge ml-2" style="background: var(--surface2); color: var(--accent);">${CATEGORIES[f.category].name}</span>`
                    : '';

                let metaHtml = '';
                if (m) {
                    metaHtml = `
                        <div class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md whitespace-nowrap"
                                style="background: var(--accent-soft); color: var(--accent);">
                                <i class="fas fa-microchip text-[10px]"></i> ${m.gpuGen}
                            </span>
                            <span class="inline-flex items-center gap-1 break-all" style="color: var(--text-dim);" title="${m.devices}">
                                <i class="fas fa-mobile-alt"></i>${m.devices}
                            </span>
                        </div>
                        <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-xs">
                            <span style="color: var(--text-dim);">${m.version}</span>
                            ${m.note ? `<span style="color: var(--amber);">${m.note}</span>` : ''}
                        </div>`;
                }

                return `
                    <div class="file-card p-4 sm:p-5">
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-start min-w-0 flex-1">
                                <div class="icon-pill mr-4 mt-0.5">
                                    <i class="${icon}"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h3 class="text-sm font-semibold truncate" style="color: var(--text);" title="${f.name}">
                                        ${f.name}${catLabel}
                                    </h3>
                                    ${metaHtml}
                                    ${!m ? `<p class="text-xs mt-1" style="color: var(--text-dim);">${f.sizeHuman}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex-shrink-0 flex flex-col items-end gap-1">
                                <a href="${getCDNUrl(f.category, f.name, f.size)}" download="${f.name}" class="dl-btn">
                                    <i class="fas fa-download"></i> 下载
                                </a>
                                ${m ? `<span class="text-xs" style="color: var(--text-dim);">${f.sizeHuman}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function showFiles() {
            const breadcrumb = document.getElementById('breadcrumb');
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';

            if (currentCategory === 'all') {
                breadcrumb.innerHTML = `<i class="fas fa-folder-open mr-2" style="color: var(--amber);"></i>/vulkans`;
            } else {
                breadcrumb.innerHTML = `<i class="fas fa-folder-open mr-2" style="color: var(--amber);"></i>/vulkans/<span style="color: var(--accent);">${currentCategory}</span>`;
            }

            const files = getCategoryFiles(currentCategory);
            renderFileList(files, '');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getFileIcon(ext) {
            const icons = {
                'so': 'fas fa-cogs',
                'apk': 'fab fa-android',
                'zip': 'fas fa-file-archive',
                'pdf': 'fas fa-file-pdf',
                'txt': 'fas fa-file-alt',
            };
            return icons[ext] || 'fas fa-file';
        }

        // ============ Theme ============
        const THEME_KEY = 'vulkans_theme';
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }
        function initTheme() {
            let theme = 'light';
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved) theme = saved;
                else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
            } catch {}
            applyTheme(theme);
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem(THEME_KEY, next); } catch {}
        }

        // ============ Init ============
        window.onload = () => {
            initTheme();
            loadReadme();
            fetchCapsViewer();
            renderCategoryNav();
            showFiles();
        };
    </script>
</body>
</html>
